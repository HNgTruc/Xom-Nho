# MySQL + Adminer cho môi trường dev. App (web, mobile) chạy ngoài Docker.
# Bật:  docker compose up -d
# Tắt:  docker compose down        (giữ dữ liệu)
# Xóa sạch dữ liệu: docker compose down -v   (cẩn thận!)

name: xom-nho

services:
  mysql:
    image: mysql:8.4
    container_name: xom-nho-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Tiếng Việt có nhiều từ 1-2 ký tự ("bà", "đi", "ăn"); mặc định FULLTEXT bỏ qua từ < 3 ký tự
      - --innodb-ft-min-token-size=1
      - --ft-min-word-len=1
      # Stopword mặc định của InnoDB (an, de, la, i...) trùng từ tiếng Việt đã bỏ dấu (ăn, để, là...).
      # Migration rebuild_fulltext_without_stopwords đã tạo index không stopword; cờ này giữ cho index tạo sau cũng vậy.
      - --innodb-ft-enable-stopword=OFF
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  adminer:
    image: adminer:latest
    container_name: xom-nho-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
