packages:
  - "backend"
  - "frontend/*"
  - "ui"
  - "shared"

# Một phiên bản cho công cụ dùng chung giữa các package. Package khai báo "catalog:" thay vì số bản.
catalog:
  "@types/node": ^24.19.2
  "@vitest/coverage-v8": ^5.1.0
  oxlint: ^1.90.0
  typescript: ~6.0.3
  vitest: ^5.1.0

# Package được chạy script cài đặt (pnpm 10 chặn mặc định): Prisma tải schema engine, tsx cần esbuild
onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - prisma
